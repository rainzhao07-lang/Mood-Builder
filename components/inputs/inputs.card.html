<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  .grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:30px;align-items:center}

<body>
  <div id="root"></div>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { Slider, EmotionWheel } = window.MoodBuilderDesignSystem_426a1b;
    function Demo(){
      return (
        <div className="grid">
          <div>
            <div className="lbl">Space adjustment</div>
            <Slider label="Element Density" defaultValue={52} mode="percent" />
            <Slider label="Color Tone" defaultValue={40} mode="tone" />
            <Slider label="Lighting Intensity" defaultValue={63} mode="percent" />
            <Slider label="Layout Style" defaultValue={30} mode="layout" />
          </div>
          <div>
            <div className="lbl" style={{textAlign:'center'}}>Subjective input</div>
            <EmotionWheel />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
