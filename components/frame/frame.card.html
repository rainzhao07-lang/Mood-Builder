<!-- @dsCard group="Components" viewport="700x460" name="PhoneFrame" subtitle="Device shell with notch + status bar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:var(--surface-app);padding:24px;display:flex;gap:30px;justify-content:center}
  .title{font-family:var(--font-display);font-size:24px;font-weight:500;line-height:1.12;letter-spacing:-.01em;color:var(--text-strong);margin:8px 0 4px}
  .lede{font-size:13px;color:var(--text-body);line-height:1.6}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent);font-weight:700}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    const { PhoneFrame, Button, MetricStat, Card } = window.MoodBuilderDesignSystem_426a1b;
    function Demo(){
      return (
        <div style={{transform:'scale(.86)',transformOrigin:'top center',display:'flex',gap:30}}>
          <PhoneFrame>
            <div style={{flex:1,overflowY:'auto',padding:'6px 22px'}}>
              <div className="eyebrow" style={{marginTop:'8px'}}>Self-report</div>
              <div className="title">Where does it<br/>feel most true?</div>
              <p className="lede">Each day you record how you feel. The space remembers, and grows.</p>
              <div style={{marginTop:'14px'}}><Card><MetricStat label="Emotion State" value="Calm" unit="0.62"/></Card></div>
            </div>
            <div style={{padding:'14px 22px 26px'}}><Button>Record Today</Button></div>
          </PhoneFrame>
          <PhoneFrame dark screen="var(--surface-immersive)">
            <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',padding:'22px'}}>
              <div className="eyebrow" style={{color:'var(--sage-300)'}}>Immersive · Day 14</div>
              <div className="title" style={{color:'var(--text-inverse)'}}>Walk inside today</div>
            </div>
            <div style={{padding:'14px 22px 26px'}}><Button variant="onDark">Exit</Button></div>
          </PhoneFrame>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
