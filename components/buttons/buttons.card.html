<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:var(--surface-screen);padding:22px;color:var(--text-strong)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .col{display:flex;flex-direction:column;gap:10px}
  .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:2px}
  .dark{background:var(--surface-immersive);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
  .inline{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    const { Button } = window.MoodBuilderDesignSystem_426a1b;
    function Demo(){
      return (
        <div className="grid">
          <div className="col">
            <div className="lbl">Primary · outlined serif pill</div>
            <Button variant="primary" size="lg">Record Today</Button>
            <Button variant="primary" size="md">Continue</Button>
            <div className="inline">
              <Button variant="quiet" size="sm">‹ Back</Button>
              <Button variant="quiet" size="sm">View all</Button>
            </div>
          </div>
          <div className="col">
            <div className="lbl">Secondary & solid</div>
            <Button variant="secondary" size="lg">Back to Archive</Button>
            <Button variant="solid" size="md">Save Snapshot</Button>
            <div className="lbl" style={{marginTop:'6px'}}>On dark / immersive</div>
            <div className="dark">
              <Button variant="onDark" size="lg">Exit</Button>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
