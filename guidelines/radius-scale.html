<!-- @dsCard group="Spacing" viewport="700x176" name="Corner radii" subtitle="Soft, generous rounding from tags to the device shell" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:var(--surface-screen);padding:22px 24px;color:var(--text-strong);display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .b{width:64px;height:64px;background:var(--panel-300);border:1px solid var(--border-hairline);border-bottom:none;border-right:none}
  .n{font-size:10px;font-weight:600}
  .v{font-size:9px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="u"><div class="b" style="border-radius:var(--radius-xs)"></div><div class="n">xs</div><div class="v">4</div></div>
  <div class="u"><div class="b" style="border-radius:var(--radius-sm)"></div><div class="n">sm</div><div class="v">8</div></div>
  <div class="u"><div class="b" style="border-radius:var(--radius-md)"></div><div class="n">md ·tile</div><div class="v">14</div></div>
  <div class="u"><div class="b" style="border-radius:var(--radius-lg)"></div><div class="n">lg ·card</div><div class="v">16</div></div>
  <div class="u"><div class="b" style="border-radius:var(--radius-xl)"></div><div class="n">xl ·chip</div><div class="v">20</div></div>
  <div class="u"><div class="b" style="border-radius:var(--radius-2xl)"></div><div class="n">2xl ·screen</div><div class="v">36</div></div>
  <div class="u"><div class="b" style="border-radius:var(--radius-pill)"></div><div class="n">pill</div><div class="v">999</div></div>
</body>
</html>
