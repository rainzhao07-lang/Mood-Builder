<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="Fraunces with an italic accent on 'Builder'" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Hanken+Grotesk:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-display);background:var(--surface-screen);padding:0;color:var(--text-strong);height:150px;display:flex;align-items:center;justify-content:center;gap:40px}
  .mark{font-size:34px;font-weight:500;letter-spacing:-.01em}
  .mark em{font-style:italic;color:var(--text-accent);font-weight:400}
  .dark{background:var(--surface-immersive);color:var(--text-inverse);padding:18px 26px;border-radius:var(--radius-lg)}
  .dark em{color:var(--sage-300)}
  .lock{font-family:var(--font-sans);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-top:6px;text-align:center}
</style>
</head>
<body>
  <div style="text-align:center"><div class="mark">Mood <em>Builder</em></div><div class="lock">Affective spatial evolution</div></div>
  <div class="dark"><div class="mark">Mood <em>Builder</em></div></div>
</body>
</html>
