<!-- @dsCard group="Colors" viewport="700x168" name="Sage, mist & band" subtitle="The calm blue-grey-green body family + blue transition band" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:var(--surface-screen);padding:20px 22px;color:var(--text-strong)}
  .row{display:flex;gap:10px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:64px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .name{font-size:11px;font-weight:600}
  .hex{font-size:10.5px;color:var(--text-muted)}
  .cap{font-size:10px;color:var(--text-muted);margin-top:12px}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--sage-600)"></div><div class="name">sage-600</div><div class="hex">#74897f</div></div>
    <div class="sw"><div class="chip" style="background:var(--sage-500)"></div><div class="name">sage-500 ·accent</div><div class="hex">#8fa39a</div></div>
    <div class="sw"><div class="chip" style="background:var(--sage-300)"></div><div class="name">sage-300</div><div class="hex">#aebfb7</div></div>
    <div class="sw"><div class="chip" style="background:var(--mist-500)"></div><div class="name">mist-500</div><div class="hex">#9fb2b3</div></div>
    <div class="sw"><div class="chip" style="background:var(--band-500)"></div><div class="name">band-500</div><div class="hex">#aebfca</div></div>
    <div class="sw"><div class="chip" style="background:var(--band-300)"></div><div class="name">band-300</div><div class="hex">#c6d2da</div></div>
  </div>
  <div class="cap">Sage is the brand's emotional accent (Calm). The pale blue band signals transitions between states.</div>
</body>
</html>
