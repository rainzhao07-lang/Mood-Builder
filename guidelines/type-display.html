<!-- @dsCard group="Type" viewport="700x230" name="Display — Fraunces" subtitle="Editorial serif headlines, occasional italic" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Hanken+Grotesk:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-display);background:var(--surface-screen);padding:22px 24px;color:var(--text-strong)}
  .meta{font-family:var(--font-sans);font-size:10px;color:var(--text-muted);letter-spacing:.06em;font-weight:500}
  .xl{font-size:var(--display-xl);font-weight:500;letter-spacing:var(--tracking-display);margin-top:4px}
  .xl em{font-style:italic;color:var(--text-accent)}
  .md{font-size:var(--display-md);font-weight:500;line-height:var(--leading-tight);margin-top:14px}
  .it{font-style:italic;font-weight:400;color:var(--text-body)}
</style>
</head>
<body>
  <div class="meta">FRAUNCES · 500 · opsz 96 · tracking −0.01em</div>
  <div class="xl">Mood <em>Builder</em></div>
  <div class="md">Where does it<br><span class="it">feel most true?</span></div>
</body>
</html>
