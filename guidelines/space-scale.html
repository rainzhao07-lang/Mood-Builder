<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px-based rhythm; mid/large steps used generously" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:var(--surface-screen);padding:22px 24px;color:var(--text-strong)}
  .row{display:flex;align-items:flex-end;gap:14px}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--sage-500);border-radius:var(--radius-xs);width:18px}
  .n{font-size:10px;font-weight:600}
  .v{font-size:9px;color:var(--text-muted)}
  .cap{font-size:10px;color:var(--text-muted);margin-top:14px}
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="bar" style="height:4px"></div><div class="n">2</div><div class="v">2</div></div>
    <div class="u"><div class="bar" style="height:8px"></div><div class="n">4</div><div class="v">8</div></div>
    <div class="u"><div class="bar" style="height:12px"></div><div class="n">5</div><div class="v">12</div></div>
    <div class="u"><div class="bar" style="height:16px"></div><div class="n">7</div><div class="v">16</div></div>
    <div class="u"><div class="bar" style="height:22px"></div><div class="n">9</div><div class="v">22</div></div>
    <div class="u"><div class="bar" style="height:26px"></div><div class="n">10</div><div class="v">26</div></div>
    <div class="u"><div class="bar" style="height:34px"></div><div class="n">12</div><div class="v">34</div></div>
    <div class="u"><div class="bar" style="height:46px"></div><div class="n">16</div><div class="v">46</div></div>
  </div>
  <div class="cap">--gutter-screen 22 · --gap-card 16 · --gap-stack 12 · --gap-field 18</div>
</body>
</html>
