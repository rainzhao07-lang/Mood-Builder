<!-- @dsCard group="Brand" viewport="700x300" name="Spatial renders" subtitle="Emotion-driven isometric 'spaces' and the immersive interior" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:var(--surface-screen);padding:20px 22px;color:var(--text-strong)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr 0.62fr;gap:12px}
  figure{margin:0;display:flex;flex-direction:column;gap:7px}
  .iso{background:var(--surface-card-deep);border-radius:var(--radius-md);overflow:hidden;display:flex;align-items:center;justify-content:center;height:150px}
  .iso img{width:100%;height:100%;object-fit:contain}
  .imm{height:150px;border-radius:var(--radius-md);overflow:hidden}
  .imm img{width:100%;height:100%;object-fit:cover}
  figcaption{font-size:10px;color:var(--text-muted);font-weight:600}
  .cap{font-size:10px;color:var(--text-muted);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
  <div class="grid">
    <figure><div class="iso"><img src="../assets/renders/space-iso-open.png" alt="open spatial state"></div><figcaption>Open · serene</figcaption></figure>
    <figure><div class="iso"><img src="../assets/renders/space-iso-lush.png" alt="lush spatial state"></div><figcaption>Lush · composed</figcaption></figure>
    <figure><div class="iso"><img src="../assets/renders/space-iso-detail.png" alt="detailed spatial state"></div><figcaption>Detailed snapshot</figcaption></figure>
    <figure><div class="imm"><img src="../assets/renders/immersive-ruins.png" alt="immersive interior"></div><figcaption>Immersive view</figcaption></figure>
  </div>
  <div class="cap">Each day's emotion composes a small isometric "space"; entering immersive mode places you first-person inside it. Renders read as warm, weathered, overgrown stone — calm but alive.</div>
</body>
</html>
