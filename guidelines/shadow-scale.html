<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--font-sans);background:var(--surface-screen);padding:26px 24px;color:var(--text-strong);display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .u{display:flex;flex-direction:column;align-items:center;gap:10px}
  .b{width:88px;height:60px;background:var(--paper-100);border-radius:var(--radius-lg)}
  .n{font-size:10px;font-weight:600}
  .v{font-size:9px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div><div class="v">subtle lift</div></div>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-card)"></div><div class="n">card</div><div class="v">resting card</div></div>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-pop)"></div><div class="n">pop</div><div class="v">dialog / sheet</div></div>
  <div class="u"><div class="b" style="box-shadow:var(--shadow-device)"></div><div class="n">device</div><div class="v">phone shell</div></div>
</body>
</html>
