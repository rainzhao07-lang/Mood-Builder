<!-- @dsCard group="Mood Builder App" viewport="470x880" name="Mood Builder — 10-screen flow" subtitle="Observe → record → calibrate → generate → adjust → immersive" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Builder — Mobile Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(1200px 600px at 70% -10%, #e4e8e4 0%, transparent 60%),
      var(--surface-app);
    font-family:var(--font-sans);color:var(--text-strong);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:30px 16px 40px;-webkit-font-smoothing:antialiased;
  }
  .stage{display:flex;flex-direction:column;align-items:center}

  /* masthead */
  .masthead{max-width:560px;text-align:center;margin-bottom:22px}
  .wordmark{font-family:var(--font-display);font-weight:500;font-size:30px;letter-spacing:-.01em}
  .wordmark em{font-style:italic;color:var(--text-accent);font-weight:400}
  .tagline{font-size:13px;color:var(--text-body);margin-top:6px;white-space:nowrap}
  .crumbs{margin-top:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-body);font-weight:600}

  /* screen shell */
  .screen{flex:1;display:flex;flex-direction:column;min-height:0}
  @media (prefers-reduced-motion: no-preference){
    .screen{animation:fade .42s var(--ease-settle)}
  }
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .body{flex:1;overflow-y:auto;padding:6px 22px 14px;position:relative}
  .body::-webkit-scrollbar{width:0}
  .body--center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .body--flush{padding:0;display:flex;flex-direction:column;overflow:hidden}

  .glyph{font-size:30px;color:var(--mist-500);margin-bottom:24px}

  .topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--text-body);font-weight:600;letter-spacing:.04em;padding:2px 0 14px}
  .topline>span{white-space:nowrap}
  .topline .back{cursor:pointer}
  .topline .back:hover{color:var(--text-strong)}
  .topline__t{font-family:var(--font-display);font-weight:500;font-size:16px;letter-spacing:-.005em;color:var(--text-strong)}
  .topline__r{color:var(--text-body)}

  .wordmark-lg{font-family:var(--font-display);font-weight:500;font-size:34px;letter-spacing:-.01em;color:var(--text-strong)}
  .wordmark-lg em{font-style:italic;color:var(--text-accent);font-weight:400}

  .row-split{display:flex;justify-content:space-between;align-items:baseline}
  .stage-k{font-family:var(--font-display);font-size:16px;font-weight:500;color:var(--text-strong)}
  .stage-v{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-body);font-weight:600}
  .delta-pill{font-size:11px;font-weight:700;color:var(--signal-alert);font-family:var(--font-display)}
  .link-q{font-size:12px;color:var(--text-accent);font-weight:600;cursor:pointer}

  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent);font-weight:700}
  .title{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.12;margin:8px 0 4px;letter-spacing:-.01em}
  .lede{font-size:13px;color:var(--text-body);line-height:1.6}
  .hint{font-size:11px;color:var(--text-body)}
  /* italic editorial captions (Newsreader) */
  .note{font-family:var(--font-serif-text);font-style:italic;font-weight:500;font-size:14px;color:var(--text-body);line-height:1.5}
  .note--c{text-align:center}
  .note--strong{color:var(--text-strong);font-weight:600}

  .footer{padding:14px 22px 24px;flex:none;display:flex;flex-direction:column;gap:10px}
  .footer .hint{text-align:center;margin-top:2px}
  .footer--dark{background:var(--surface-immersive)}

  /* energy / pleasantness field */
  .field{position:relative;height:148px;background:linear-gradient(135deg,#cdd8d5,#bcc9c6);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
  .field span{position:absolute;font-size:9px;color:#586765;font-weight:600;letter-spacing:.06em}
  .field-dot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--interactive);box-shadow:var(--ring-dot)}

  .genline{font-family:var(--font-serif-text);font-style:italic;font-size:14px;color:var(--text-body);text-align:center;margin:12px 0 4px;line-height:1.5}
  .genline b{color:var(--text-strong);font-style:normal;font-weight:600}

  /* insights bits */
  .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-body);font-weight:600;margin-bottom:8px}
  .delta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;padding:11px 0;border-bottom:1px solid var(--border-hairline)}
  .delta:last-child{border-bottom:none}
  .delta span:first-child{display:flex;flex-direction:column;gap:2px}
  .delta b{font-weight:600;color:var(--text-strong);font-size:13px}
  .delta i{font-family:var(--font-serif-text);font-style:italic;color:var(--text-body);font-size:12.5px}
  .delta .d{font-weight:700;font-family:var(--font-display);font-size:15px;white-space:nowrap}
  .delta .up{color:var(--sage-600)} .delta .dn{color:var(--signal-alert)}
  .splitbar{display:flex;height:8px;border-radius:var(--radius-pill);overflow:hidden;margin:10px 0 6px}
  .splitbar .o{background:var(--mist-500)} .splitbar .s{background:var(--gold-500)}
  .splitlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-body);font-weight:600}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap}

  /* compare */
  .cmp-meta{display:flex;justify-content:space-between;gap:12px;margin:10px 0 4px}
  .cmp-meta b{display:block;font-size:13px;color:var(--text-strong);font-weight:600}
  .cmp-meta i{font-family:var(--font-serif-text);font-style:italic;font-size:12px;color:var(--text-body)}
  .cmp{position:relative;height:200px;border-radius:var(--radius-md);overflow:hidden;margin:10px 0;user-select:none;background:#cdd8d5}
  .cmp-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cmp-img--mono{filter:saturate(.45) brightness(1.03)}
  .cmp-side{position:absolute;inset:0}
  .cmp .tagc{position:absolute;top:10px;font-size:9px;font-weight:700;letter-spacing:.06em;background:rgba(47,62,66,.82);color:var(--text-inverse);padding:3px 8px;border-radius:var(--radius-xs);z-index:3}
  .cmp .tagc.l{left:10px}.cmp .tagc.r{right:10px}
  .cmp .handle{position:absolute;top:0;bottom:0;width:2px;background:var(--paper-100);cursor:ew-resize;z-index:4;transform:translateX(-1px)}
  .cmp .handle::after{content:"\21C4";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;background:var(--paper-100);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-strong);box-shadow:var(--shadow-pop)}

  /* immersive */
  .imm{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .imm-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .imm::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,28,30,.05) 0%, rgba(20,28,30,.62) 100%)}
  .imm-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;z-index:5}
  .imm-top span{font-size:11px;font-weight:600;color:var(--text-inverse);background:rgba(255,255,255,.14);padding:6px 11px;border-radius:var(--radius-pill);backdrop-filter:blur(4px);cursor:pointer}
  .imm-meta{position:relative;z-index:5;color:var(--text-inverse);padding:22px}
  .imm-e{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-300);font-weight:700}
  .imm-t{font-family:var(--font-display);font-size:25px;margin:5px 0 4px;font-weight:500}
  .imm-s{font-size:12px;color:#c4cdc3;line-height:1.5}

  /* nav dots */
  .dots{display:flex;gap:9px;margin-top:24px}
  .dot{width:8px;height:8px;border-radius:50%;border:none;background:var(--panel-400);cursor:pointer;padding:0;transition:background var(--dur-base),transform var(--dur-base)}
  .dot--on{background:var(--interactive);transform:scale(1.25)}
  .navhint{font-size:11px;color:var(--text-body);margin-top:12px}
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#d7dcd8"/>
      <circle cx="50" cy="46" r="22" fill="#8fa39a"/>
      <circle cx="50" cy="46" r="9" fill="#f4f5f2"/>
      <circle cx="58" cy="40" r="4.5" fill="#2f3e42"/>
      <rect x="30" y="76" width="40" height="9" rx="4.5" fill="none" stroke="#2f3e42" stroke-width="1.6"/>
    </svg>
  </template>
  <div id="root"></div>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    const Root = window.MB_App;
    ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
  </script>
</body>
</html>
